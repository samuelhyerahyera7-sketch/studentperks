<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudentPerks 3D Avatar Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#0d1014;color:#fff}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#0d1014;border-bottom:1px solid #2a3038}.brand{font-size:19px;font-weight:900}.mark{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:6px;border-radius:7px;background:#8cff13;color:#050505}.label{margin-left:auto;padding:8px 12px;border-radius:999px;background:#20262e;font-size:12px;font-weight:800}.notice{padding:8px 16px;background:#dfffad;color:#101410;text-align:center;font-size:12px;font-weight:700}.frame{position:relative;min-height:0}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.desktop{display:block}.mobile{display:none}@media(max-width:700px){.bar{padding:9px 12px}.brand{font-size:16px}.notice{font-size:11px;padding:7px 10px}.desktop{display:none}.mobile{display:block}}
</style>
</head>
<body>
<div class="app">
<header><div class="bar"><div class="brand"><span class="mark">S</span>StudentPerks</div><span class="label">Private concept test</span></div><div class="notice">3D avatar technology test only. This is not connected to StudentPerks or your student account.</div></header>
<main class="frame">
<iframe class="desktop" src="https://metaperson.avatarsdk.com/iframe.html" allow="camera; fullscreen" title="3D avatar creator"></iframe>
<iframe class="mobile" src="https://mobile.metaperson.avatarsdk.com/generator" allow="camera; fullscreen" title="Mobile 3D avatar creator"></iframe>
</main>
</div>
</body>
</html>
