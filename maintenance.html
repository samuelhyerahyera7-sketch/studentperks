<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>StudentPerks | Maintenance</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7faf8;color:#14231a;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#fff;border:1px solid #e3ebe6;border-radius:24px;padding:48px 32px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.08)}.brand{font-size:32px;font-weight:800;color:#159447;margin-bottom:28px}.brand span{color:#14231a}h1{font-size:34px;margin:0 0 14px}p{font-size:17px;line-height:1.6;color:#5b6860;margin:0 auto;max-width:480px}.dot{width:12px;height:12px;background:#159447;border-radius:50%;display:inline-block;margin-right:8px;animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.35}}.status{margin-top:30px;font-size:14px;font-weight:700;color:#159447}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Student<span>Perks</span></div>
    <h1>We’ll be back soon.</h1>
    <p>StudentPerks is currently undergoing scheduled maintenance while we make improvements to the platform. Thank you for your patience.</p>
    <div class="status"><span class="dot"></span>Maintenance in progress</div>
  </main>
</body>
</html>
