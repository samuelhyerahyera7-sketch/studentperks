<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c0c0c">
  <title>StudentPerks | Under Maintenance</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #0c0c0c;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: rgba(212,255,0,.07);
      filter: blur(80px);
      top: -160px;
      right: -120px;
      pointer-events: none;
    }
    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }
    .brand {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -.04em;
    }
    .brand span { color: #d4ff00; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: min(720px, 100%);
      text-align: center;
      padding: 64px 24px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 1px solid rgba(212,255,0,.28);
      background: rgba(212,255,0,.08);
      color: #d4ff00;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 26px;
    }
    .dot {
      width: 7px;
      height: 7px;
      background: #d4ff00;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(212,255,0,.75);
    }
    h1 {
      font-size: clamp(44px, 8vw, 86px);
      line-height: .95;
      letter-spacing: -.065em;
      font-weight: 900;
      margin-bottom: 24px;
    }
    h1 span { color: #d4ff00; }
    p {
      max-width: 560px;
      margin: 0 auto;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.7;
      color: rgba(255,255,255,.58);
    }
    .contact {
      margin-top: 28px;
      font-size: 13px;
      color: rgba(255,255,255,.34);
    }
    .contact a { color: #d4ff00; text-decoration: none; }
    footer {
      color: rgba(255,255,255,.22);
      font-size: 12px;
      text-align: center;
      padding-bottom: 4px;
    }
    @media (max-width: 560px) {
      .page { padding: 20px; }
      .card { padding: 40px 0; }
      h1 { font-size: 48px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">Student<span>Perks</span></div>
    <main>
      <section class="card">
        <div class="pill"><span class="dot"></span> Maintenance in progress</div>
        <h1>We’re making<br><span>StudentPerks better.</span></h1>
        <p>Our website is temporarily unavailable while we make a few improvements. We’ll be back online soon with a better StudentPerks experience.</p>
        <div class="contact">Need to reach us? <a href="mailto:admin@studentperks.co.za">admin@studentperks.co.za</a></div>
      </section>
    </main>
    <footer>© 2026 StudentPerks. All rights reserved.</footer>
  </div>
</body>
</html>
