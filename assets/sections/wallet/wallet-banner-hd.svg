      <text x="282" y="175" font-size="53" font-weight="900" fill="#91ff00">Perks.</text>
      <text x="84" y="217" font-size="19" font-weight="600" letter-spacing="9" fill="#fff">SOUTH AFRICA</text>
    </g>
    <g fill="#91ff00">
