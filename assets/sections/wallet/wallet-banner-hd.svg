<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 690" role="img" aria-labelledby="title desc">
  <title id="title">StudentPerks Wallet banner</title>
  <desc id="desc">StudentPerks card on a soft mint background.</desc>
  <defs>
    <linearGradient id="mint" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3ffe9"/>
      <stop offset="1" stop-color="#e8fbdc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0b1205" flood-opacity=".20"/>
    </filter>
  </defs>

  <rect x="30" y="64" width="1988" height="562" rx="54" fill="url(#mint)"/>

  <g transform="translate(454 136) rotate(-5 570 184)" filter="url(#shadow)">
    <rect x="0" y="0" width="1140" height="368" rx="44" fill="#0c0d0d"/>

    <g font-family="Inter, Arial, Helvetica, sans-serif">
      <text x="118" y="205" font-size="96" font-weight="900" fill="#fff">Student</text>
      <text x="514" y="205" font-size="96" font-weight="900" fill="#91ff00">Perks.</text>
      <text x="128" y="262" font-size="30" font-weight="600" letter-spacing="16" fill="#fff">SOUTH AFRICA</text>
    </g>

    <g fill="#91ff00">
      <rect x="890" y="62" width="28" height="108" rx="14" transform="rotate(17 904 116)"/>
      <rect x="974" y="91" width="28" height="108" rx="14" transform="rotate(47 988 145)"/>
      <rect x="1018" y="178" width="28" height="116" rx="14" transform="rotate(88 1032 236)"/>
    </g>
  </g>
</svg>