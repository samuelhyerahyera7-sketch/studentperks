<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 690" role="img" aria-labelledby="title desc">
  <title id="title">StudentPerks Wallet banner</title>
  <desc id="desc">Your deals, all in one place. StudentPerks Wallet promotional banner.</desc>
  <defs>
    <linearGradient id="mint" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4ffe9"/>
      <stop offset="1" stop-color="#e8fbdc"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" x2="1">
      <stop offset="0" stop-color="#98ff00"/>
      <stop offset="1" stop-color="#b6ff25"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#0b1205" flood-opacity=".20"/>
    </filter>
  </defs>

  <rect x="30" y="92" width="1988" height="508" rx="42" fill="url(#mint)"/>

  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="96" y="242" font-size="86" font-weight="900" letter-spacing="-4" fill="#050505">Your deals, all in one place.</text>
    <text x="98" y="330" font-size="50" font-weight="400" letter-spacing="-1.5" fill="#262d3a">Once verified, your StudentPerks Wallet</text>
    <text x="98" y="391" font-size="50" font-weight="400" letter-spacing="-1.5" fill="#262d3a">keeps your claimed offers ready to use.</text>

    <rect x="92" y="438" width="674" height="132" rx="66" fill="url(#lime)"/>
    <text x="168" y="522" font-size="52" font-weight="800" letter-spacing="-2" fill="#050505">Join StudentPerks</text>
    <path d="M650 505h54m-19-19 19 19-19 19" fill="none" stroke="#050505" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1188 142) rotate(-6 300 190)" filter="url(#shadow)">
