    <g fill="#050505" transform="translate(27 27)">
      <path d="M0 0h52v52H0zm11 11v30h30V11zM94 0h52v52H94zm11 11v30h30V11zM0 94h52v52H0zm11 11v30h30v-30z" fill-rule="evenodd"/>
      <rect x="66" y="0" width="10" height="10"/><rect x="77" y="11" width="10" height="10"/><rect x="66" y="22" width="21" height="10"/><rect x="55" y="33" width="10" height="21"/><rect x="66" y="55" width="10" height="10"/><rect x="77" y="44" width="21" height="10"/><rect x="99" y="55" width="10" height="21"/><rect x="121" y="66" width="25" height="10"/><rect x="55" y="77" width="21" height="10"/><rect x="77" y="66" width="10" height="21"/><rect x="88" y="88" width="21" height="10"/><rect x="110" y="77" width="10" height="21"/><rect x="121" y="99" width="25" height="10"/><rect x="55" y="110" width="10" height="10"/><rect x="66" y="121" width="21" height="10"/><rect x="88" y="110" width="10" height="25"/><rect x="99" y="132" width="10" height="14"/><rect x="110" y="121" width="10" height="10"/><rect x="121" y="132" width="25" height="14"/>
    </g>
