<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">StudentPerks student wallet card</title><desc id="desc">Dynamic card template. Replace data fields at runtime.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080909"/><stop offset="1" stop-color="#151617"/></linearGradient><linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#242628" stop-opacity="0"/><stop offset=".55" stop-color="#242628" stop-opacity=".22"/><stop offset="1" stop-color="#242628" stop-opacity=".05"/></linearGradient></defs><rect x="8" y="8" width="984" height="544" rx="42" fill="url(#bg)"/><path d="M0 510C210 400 420 338 620 330c160-6 260 28 380 78v152H0Z" fill="url(#sweep)"/><g font-family="Arial,Helvetica,sans-serif"><text x="55" y="105" fill="#fff" font-size="58" font-weight="800">Student<tspan fill="#8cff00">Perks</tspan></text><text x="58" y="142" fill="#fff" font-size="19" font-weight="700" letter-spacing="9">SOUTH AFRICA</text><g stroke="#8cff00" stroke-width="10" stroke-linecap="round"><path d="M492 45v-22"/><path d="M515 55l18-16"/><path d="M520 80h25"/></g><text id="student-name" data-field="studentName" x="55" y="300" fill="#fff" font-size="42" font-weight="800">STUDENT NAME</text><text id="institution" data-field="institution" x="55" y="345" fill="#d9d9d9" font-size="27">INSTITUTION</text><circle cx="78" cy="402" r="22" fill="#8cff00"/><path d="m68 402 7 7 14-17" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="412" fill="#8cff00" font-size="27" font-weight="700">Verified student</text><text x="55" y="468" fill="#c8c8c8" font-size="23">Member no.</text><text id="member-number" data-field="memberNumber" x="205" y="468" fill="#c8c8c8" font-size="23" letter-spacing="2">SP000000000</text></g><g transform="translate(570 120) rotate(-5)"><text fill="#fff" font-family="Comic Sans MS,cursive" font-size="37" font-weight="700"><tspan x="0" y="0">STUDENTS</tspan><tspan x="0" y="45">LIVE MORE</tspan><tspan x="0" y="90">SPEND LESS</tspan></text><path d="M15 112c50-25 105-28 145-24" fill="none" stroke="#8cff00" stroke-width="12" stroke-linecap="round"/></g><g id="qr-slot" data-field="qrCode"><rect x="790" y="70" width="155" height="155" rx="20" fill="#fff"/><rect x="812" y="92" width="111" height="111" fill="#fff" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/><text x="867" y="155" text-anchor="middle" font-family="Arial" font-size="16" fill="#111">QR CODE</text></g><text x="867" y="255" text-anchor="middle" fill="#d5d5d5" font-family="Arial" font-size="20">Tap to enlarge</text><g transform="translate(700 385)"><rect width="250" height="78" rx="39" fill="#b7ff19"/><text x="38" y="50" fill="#111" font-family="Arial" font-size="26" font-weight="700">Open wallet</text><path d="M196 39h27m-10-10 10 10-10 10" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>